<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Prevent flash of wrong theme - must run before CSS -->
  <script>
    (() => {
      const theme = localStorage.getItem("theme");
      const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;

      if (theme === "dark" || (!theme && prefersDark)) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
  <link rel="icon" href="./favicon.ico" />
  <link rel="stylesheet" href="./index.css" />
  <script type="module" src="./shared/theme-toggle.ts"></script>
  <script type="module" src="./components/PostsList.ts"></script>
  <title>abyrd.me</title>
</head>

<body class="w-full min-h-dvh flex flex-col p-0">
  <!-- Navigation Bar - injected by plugin -->
  <div id="nav-bar"></div>

  <!-- Main Content -->
  <main class="mx-auto w-full max-w-3xl px-6 pb-16 flex-1">
    <posts-list id="writing"></posts-list>
  </main>

  <!-- Footer - injected by plugin -->
  <div id="footer"></div>
</body>

</html>
