<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Prevent flash of wrong theme - must run before CSS -->
  <script>
    (() => {
      const theme = localStorage.getItem("theme");
      const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;

      if (theme === "dark" || (!theme && prefersDark)) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
  <link rel="stylesheet" type="text/css"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" type="text/css"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <link rel="stylesheet" href="./index.css">
  <title>404 - Not Found</title>
</head>

<body class="w-full min-h-dvh flex flex-col p-0 items-center justify-center">
  <p class="text-sm font-medium tracking-tight">You're lost. <a href="/" class="text-sm font-medium tracking-tight">
      <span>Return Home</span>
      <i class="ph ph-arrow-up-right"></i>
    </a></p>

</body>

</html>
